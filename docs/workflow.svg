<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">Storefront Experience</title><desc id="desc">Animated workflow for FlowerStore.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160d1b"/><stop offset="1" stop-color="#173027"/></linearGradient><linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff8fca"/><stop offset=".5" stop-color="#ffd89c"/><stop offset="1" stop-color="#74e0b7"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#74e0b7"/></marker></defs><rect x="1" y="1" width="1198" height="408" rx="22" fill="url(#bg)" stroke="url(#flow)" stroke-opacity=".58" stroke-width="2"/><text x="45" y="57" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="750">Storefront Experience</text><text x="47" y="86" fill="#ff8fca" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700">A CONSISTENT VISUAL JOURNEY ACROSS THREE PAGES</text><g transform="translate(45 146)"><rect width="246" height="132" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#ff8fca" stroke-opacity=".45"/><circle cx="35" cy="36" r="18" fill="#ff8fca" fill-opacity=".16" stroke="#ff8fca"/><text x="35" y="42" text-anchor="middle" fill="#74e0b7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="750">01</text><text x="25" y="82" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="750">Navigation</text><text x="25" y="108" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Home, About, Contact</text></g><g transform="translate(333 146)"><rect width="246" height="132" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#ffd89c" stroke-opacity=".45"/><circle cx="35" cy="36" r="18" fill="#ffd89c" fill-opacity=".16" stroke="#ffd89c"/><text x="35" y="42" text-anchor="middle" fill="#74e0b7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="750">02</text><text x="25" y="82" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="750">Page Content</text><text x="25" y="108" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Story, imagery and form</text></g><g transform="translate(621 146)"><rect width="246" height="132" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#ff8fca" stroke-opacity=".45"/><circle cx="35" cy="36" r="18" fill="#ff8fca" fill-opacity=".16" stroke="#ff8fca"/><text x="35" y="42" text-anchor="middle" fill="#74e0b7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="750">03</text><text x="25" y="82" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="750">Visual System</text><text x="25" y="108" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Glass layers and motion</text></g><g transform="translate(909 146)"><rect width="246" height="132" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#ffd89c" stroke-opacity=".45"/><circle cx="35" cy="36" r="18" fill="#ffd89c" fill-opacity=".16" stroke="#ffd89c"/><text x="35" y="42" text-anchor="middle" fill="#74e0b7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="750">04</text><text x="25" y="82" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="750">Browser</text><text x="25" y="108" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Static responsive delivery</text></g><path d="M291 212H333" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.3s" repeatCount="indefinite"/></path><circle r="4" fill="#74e0b7" filter="url(#glow)"><animateMotion dur="2s" repeatCount="indefinite" path="M291 212H333"/></circle><path d="M579 212H621" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.3s" repeatCount="indefinite"/></path><circle r="4" fill="#74e0b7" filter="url(#glow)"><animateMotion dur="2s" repeatCount="indefinite" path="M579 212H621"/></circle><path d="M867 212H909" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.3s" repeatCount="indefinite"/></path><circle r="4" fill="#74e0b7" filter="url(#glow)"><animateMotion dur="2s" repeatCount="indefinite" path="M867 212H909"/></circle><g transform="translate(45 316)"><rect width="1110" height="58" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#ff8fca" stroke-opacity=".2"/><circle cx="27" cy="29" r="6" fill="#ff8fca"><animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/></circle><text x="48" y="35" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">The storefront runs without a framework, package manager or backend.</text></g></svg>